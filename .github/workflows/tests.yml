name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build twine

      - name: Run tests
        run: python -m pytest --cov --cov-report=term-missing

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Audit Python dependencies
        if: matrix.python-version == '3.13'
        run: |
          python scripts/export_audit_requirements.py /tmp/audit-requirements.txt
          pip-audit --strict --requirement /tmp/audit-requirements.txt

      - name: Verify OpenAPI snapshot
        run: python scripts/export_openapi.py --check

      - name: Build wheel and source distribution
        run: |
          python -m build
          twine check dist/*

      - name: Smoke test clean wheel and source installations
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          python -m venv /tmp/stand-wheel-test
          /tmp/stand-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/stand-wheel-test/bin/automation-test-stand --help >/dev/null
          python -m venv /tmp/stand-sdist-test
          /tmp/stand-sdist-test/bin/python -m pip install dist/*.tar.gz
          /tmp/stand-sdist-test/bin/automation-test-stand --help >/dev/null

      - name: Smoke test installed wheel runtime
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          /tmp/stand-wheel-test/bin/automation-test-stand --port 18080 >/tmp/stand-wheel.log 2>&1 &
          stand_pid=$!
          trap 'kill "$stand_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:18080/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/stand-wheel.log
              exit 1
            fi
            sleep 1
          done

          test "$(curl --silent http://localhost:18080/health)" = '{"status":"ok"}'
          curl --fail --silent \
            'http://localhost:18080/catalog?scenario=transient&run_id=ci-wheel&fail_for=2' \
            >/dev/null

          for expected_status in 503 503 200; do
            actual_status="$(
              curl --silent \
                --dump-header /tmp/stand-wheel.headers \
                --output /tmp/stand-wheel.body \
                --write-out '%{http_code}' \
                'http://localhost:18080/api/catalog?scenario=transient&run_id=ci-wheel&fail_for=2&page=1'
            )"
            test "$actual_status" = "$expected_status"
            if [ "$expected_status" = 503 ]; then
              tr -d '\r' </tmp/stand-wheel.headers | grep --ignore-case --quiet '^retry-after: 1$'
            fi
          done

          kill "$stand_pid"
          wait "$stand_pid" || true
          trap - EXIT

      - name: Validate a clean clone
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          git clone --depth=1 --no-local . /tmp/stand-clean-clone
          cd /tmp/stand-clean-clone
          python -m build --outdir /tmp/stand-clean-dist
          python -m venv /tmp/stand-clean-install
          /tmp/stand-clean-install/bin/python -m pip install /tmp/stand-clean-dist/*.whl
          /tmp/stand-clean-install/bin/automation-test-stand --help >/dev/null

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify Compose configuration
        run: docker compose config --quiet

      - name: Build runtime image
        run: docker build --tag resilient-automation-test-stand:ci .

      - name: Verify non-root runtime user
        shell: bash
        run: test "$(docker image inspect --format '{{.Config.User}}' resilient-automation-test-stand:ci)" = "appuser"

      - name: Start runtime image
        run: docker run --detach --read-only --name automation-test-stand-ci --publish 8080:8080 resilient-automation-test-stand:ci

      - name: Wait for health and verify endpoints
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs automation-test-stand-ci
              exit 1
            fi
            sleep 1
          done
          test "$(curl --silent http://localhost:8080/health)" = '{"status":"ok"}'
          curl --fail --silent \
            'http://localhost:8080/catalog?scenario=transient&run_id=ci-docker&fail_for=2' \
            >/dev/null

          for expected_status in 503 503 200; do
            actual_status="$(
              curl --silent \
                --dump-header /tmp/stand-docker.headers \
                --output /tmp/stand-docker.body \
                --write-out '%{http_code}' \
                'http://localhost:8080/api/catalog?scenario=transient&run_id=ci-docker&fail_for=2&page=1'
            )"
            test "$actual_status" = "$expected_status"
            if [ "$expected_status" = 503 ]; then
              tr -d '\r' </tmp/stand-docker.headers | grep --ignore-case --quiet '^retry-after: 1$'
            fi
          done

          docker exec automation-test-stand-ci python -c "import importlib.util, pathlib; assert importlib.util.find_spec('pytest') is None; assert not pathlib.Path('/app/tests').exists()"

      - name: Stop runtime image
        if: always()
        run: docker rm --force automation-test-stand-ci
