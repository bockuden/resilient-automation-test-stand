[auth]
username = "demo"
password_env = "TEST_PASSWORD"

[selectors]
# These values are stable data-testid tokens, not CSS selector expressions.
username = "username"
password = "password"
login_button = "login-submit"
catalog = "catalog"
item = "catalog-item"
item_name = "item-name"
item_price = "item-price"
next_page = "next-page"

[presets.ten-pages]
scenario = "success"
total_pages = 10

[presets.login-ten-pages]
scenario = "success"
protected = true
total_pages = 10

[presets.login-delayed-retry]
scenario = "transient"
protected = true
total_pages = 10
fail_for = 2
failure_delay_ms = 1500

[presets.selector-missing]
scenario = "selector-failure"

[presets.selector-missing.selector_failure]
target = "next_page"
mode = "missing"
page = 2

[presets.rate-limited]
scenario = "rate-limit"
rate_limit_for = 2
retry_after_seconds = 1

[presets.malformed-json]
scenario = "malformed-api"
malformed_mode = "invalid_json"

[presets.session-expiry]
scenario = "success"
protected = true
expire_session_after_page = 2

[presets.composite-nightmare]
scenario = "success"
protected = true
total_pages = 10

[[presets.composite-nightmare.events]]
page = 2
type = "http_error"
status = 503
attempts = 2

[[presets.composite-nightmare.events]]
page = 4
type = "duplicate_items"

[[presets.composite-nightmare.events]]
page = 5
type = "expire_session"

[[presets.composite-nightmare.events]]
page = 7
type = "selector_change"
target = "next_page"

[[presets.composite-nightmare.events]]
page = 9
type = "delay"
delay_ms = 3000
