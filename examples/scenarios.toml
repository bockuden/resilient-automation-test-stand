[auth]
username = "demo"
password_env = "TEST_PASSWORD"

[selectors]
# These values are stable data-testid tokens, not CSS selector expressions.
username = "username"
password = "password"
login_button = "login-submit"
catalog = "catalog"
item = "catalog-item"
item_name = "item-name"
item_price = "item-price"
next_page = "next-page"

[presets.ten-pages]
scenario = "success"
total_pages = 10

[presets.login-ten-pages]
scenario = "success"
protected = true
total_pages = 10

[presets.login-delayed-retry]
scenario = "transient"
protected = true
total_pages = 10
fail_for = 2
failure_delay_ms = 1500

[presets.selector-missing]
scenario = "selector-failure"

[presets.selector-missing.selector_failure]
target = "next_page"
mode = "missing"
page = 2

[presets.rate-limited]
scenario = "rate-limit"
rate_limit_for = 2
retry_after_seconds = 1
