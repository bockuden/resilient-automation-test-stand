[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-automation-test-stand"
version = "0.3.0"
description = "A deterministic FastAPI target for browser automation integration tests"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = [
  "browser-automation",
  "chaos-testing",
  "fastapi",
  "integration-testing",
  "playwright",
  "resilience",
  "selenium",
  "testing",
  "web-scraping",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
authors = [
  { name = "Yehor Maksimov" }
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.34,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0"
]

[project.scripts]
automation-test-stand = "resilient_automation_test_stand.cli:main"

[project.urls]
Source = "https://github.com/bockuden/resilient-automation-test-stand"
Issues = "https://github.com/bockuden/resilient-automation-test-stand/issues"
Documentation = "https://github.com/bockuden/resilient-automation-test-stand#readme"
Changelog = "https://github.com/bockuden/resilient-automation-test-stand/blob/main/CHANGELOG.md"
"API contract" = "https://github.com/bockuden/resilient-automation-test-stand/blob/main/docs/compatibility.md"

[tool.setuptools.packages.find]
include = ["resilient_automation_test_stand*"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
