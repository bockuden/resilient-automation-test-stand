[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-automation-test-stand"
version = "1.1.1"
description = "A deterministic FastAPI target for browser automation integration tests"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = [
  "browser-automation",
  "chaos-testing",
  "fastapi",
  "integration-testing",
  "playwright",
  "resilience",
  "selenium",
  "testing",
  "web-scraping",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
authors = [
  { name = "Yehor Maksimov" }
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.34,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pip-audit>=2.9,<3.0",
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.12,<1.0",
]

[project.scripts]
automation-test-stand = "resilient_automation_test_stand.cli:main"

[project.urls]
Source = "https://github.com/bockuden/resilient-automation-test-stand"
Issues = "https://github.com/bockuden/resilient-automation-test-stand/issues"
Documentation = "https://github.com/bockuden/resilient-automation-test-stand#readme"
Changelog = "https://github.com/bockuden/resilient-automation-test-stand/blob/main/CHANGELOG.md"
"API contract" = "https://github.com/bockuden/resilient-automation-test-stand/blob/main/docs/compatibility.md"

[tool.setuptools.packages.find]
include = ["resilient_automation_test_stand*"]

[tool.setuptools.package-data]
resilient_automation_test_stand = ["static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["resilient_automation_test_stand"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
